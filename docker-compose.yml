name: chiron-project

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chiron}
      POSTGRES_USER: ${POSTGRES_USER:-chiron}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chiron_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chiron} -d ${POSTGRES_DB:-chiron}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      target: development
    command: uvicorn chiron_api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Chiron Project API}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:5173}
      APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-change-me-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://chiron:chiron_dev_password@db:5432/chiron}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/tests:/app/tests
      - ./apps/api/alembic.ini:/app/alembic.ini
      - ./apps/api/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: development
    command: npm run dev
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
      - ./apps/web/index.html:/app/index.html
    depends_on:
      - api

volumes:
  postgres_data:
