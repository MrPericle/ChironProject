name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Scrivi DEPLOY per confermare il rilascio di main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy approved main commit
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://makastudio.it
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/maka_deploy
          printf '%s\n' "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/maka_deploy ~/.ssh/known_hosts

      - name: Deploy selected commit
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          ssh \
            -i ~/.ssh/maka_deploy \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            bash -s -- "${DEPLOY_SHA}" <<'REMOTE'
          set -Eeuo pipefail

          expected_sha="$1"
          cd /srv/maka/app

          if [[ -n "$(git status --porcelain --untracked-files=no)" ]]; then
            echo "Il repository sul server contiene modifiche tracciate non committate." >&2
            exit 1
          fi

          git fetch --prune origin
          git checkout main
          git merge --ff-only origin/main

          EXPECTED_SHA="${expected_sha}" \
          EXPECTED_APP_DOMAIN="makastudio.it" \
          EXPECTED_API_DOMAIN="api.makastudio.it" \
          BACKUP_DIR="/srv/maka-backups" \
            ./scripts/deploy-release.sh
          REMOTE
