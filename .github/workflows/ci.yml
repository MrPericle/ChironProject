name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chiron
          POSTGRES_USER: chiron
          POSTGRES_PASSWORD: chiron_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chiron -d chiron"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --editable ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+psycopg://chiron:chiron_dev_password@localhost:5432/chiron
        run: alembic upgrade head

      - name: Test
        env:
          BOOKING_DATABASE_URL: postgresql+psycopg://chiron:chiron_dev_password@localhost:5432/chiron
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  production-images:
    name: Production images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate development Compose file
        run: docker compose config

      - name: Validate production Compose file
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml config --quiet

      - name: Validate Caddyfile
        run: >-
          docker run --rm
          -e ACME_EMAIL=admin@example.it
          -e APP_DOMAIN=example.it
          -e API_DOMAIN=api.example.it
          -v "$PWD/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile

      - name: Build production images
        run: docker compose --env-file .env.production.example -f docker-compose.prod.yml build api web
